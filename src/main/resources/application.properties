spring.application.name=festival-scope
server.forward-headers-strategy=framework
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
document.parsing.max-text-length=${DOCUMENT_PARSING_MAX_TEXT_LENGTH:120000}

naver.client-id=${NAVER_CLIENT_ID}
naver.client-secret=${NAVER_CLIENT_SECRET}
openai.api-key=${OPENAI_API_KEY:}
openai.model=${OPENAI_MODEL:gpt-4o-mini}
openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=${JWT_ACCESS_TOKEN_EXPIRATION:3600000}
jwt.refresh-token-expiration=${JWT_REFRESH_TOKEN_EXPIRATION:1209600000}
tourism.visitor.service-key=${TOURISM_VISITOR_SERVICE_KEY}
tourism.visitor.base-url=https://apis.data.go.kr/B551011/DataLabService
tourism.visitor.endpoint=/locgoRegnVisitrDDList
tourism.resource-demand.base-url=${TOURISM_RESOURCE_DEMAND_BASE_URL:https://apis.data.go.kr/B551011/AreaTarResDemService}
tourism.demand-intensity.base-url=${TOURISM_DEMAND_INTENSITY_BASE_URL:https://apis.data.go.kr/B551011/AreaTarDemDsService}
tourism.linkage.base-ym=${TOURISM_LINKAGE_BASE_YM:202608}
bus.stop-url=${BUS_STOP_API_URL:https://apis.data.go.kr/1613000/BusStop/getBusStop}
bus.route-url=${BUS_ROUTE_API_URL:https://apis.data.go.kr/1613000/NumberofRoutesServingEachStop/getNumberofRoutesServingEachStop}
bus.route.service-key=${BUS_ROUTE_API_KEY:}
bus.route.operation-date=${BUS_ROUTE_OPERATION_DATE:}
bus.route.ctpv-code=${BUS_ROUTE_CTPV_CODE:}
bus.route.sgg-code=${BUS_ROUTE_SGG_CODE:}
bus.service-key=${BUS_API_KEY}
springdoc.swagger-ui.url=/v3/api-docs
kma.asos.api-key=${KMA_ASOS_API_KEY:}
kma.asos.api-url=${KMA_ASOS_API_URL:https://apis.data.go.kr/1360000/AsosDalyInfoService/getWthrDataList}
kma.asos.analysis-years=${WEATHER_ANALYSIS_YEARS:5}
kma.asos.rain-threshold=${WEATHER_RAIN_THRESHOLD:0}
kma.asos.hot-day-threshold=${HOT_DAY_THRESHOLD:33}
kma.asos.cold-day-threshold=${COLD_DAY_THRESHOLD:-10}
kma.asos.strong-wind-threshold=${STRONG_WIND_THRESHOLD:10}
